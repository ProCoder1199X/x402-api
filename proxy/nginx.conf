events {}

http {
  upstream alpharoute { server alpharoute:3000; }
  upstream sentinelfeed { server sentinelfeed:3000; }
  upstream complyrail { server complyrail:3000; }
  upstream distillforge { server distillforge:3000; }
  upstream proofmesh { server proofmesh:3000; }

  server {
    listen 8080;

    location /alpharoute/ { proxy_pass http://alpharoute/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /sentinelfeed/ { proxy_pass http://sentinelfeed/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /complyrail/ { proxy_pass http://complyrail/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /distillforge/ { proxy_pass http://distillforge/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /proofmesh/ { proxy_pass http://proofmesh/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
