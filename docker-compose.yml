services:
  alpharoute:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: alpharoute }
    env_file: .env
    environment: { SERVICE_NAME: alpharoute, PORT: 3000 }
  sentinelfeed:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: sentinelfeed }
    env_file: .env
    environment: { SERVICE_NAME: sentinelfeed, PORT: 3000 }
  complyrail:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: complyrail }
    env_file: .env
    environment: { SERVICE_NAME: complyrail, PORT: 3000 }
  distillforge:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: distillforge }
    env_file: .env
    environment: { SERVICE_NAME: distillforge, PORT: 3000 }
  proofmesh:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: proofmesh }
    env_file: .env
    environment: { SERVICE_NAME: proofmesh, PORT: 3000 }
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - alpharoute
      - sentinelfeed
      - complyrail
      - distillforge
      - proofmesh
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
